[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kannon"
version = "0.1.0"
description = "Terminal document thumbnail browser with sixel and ANSI renderers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kannon contributors" }]
dependencies = [
  "Pillow>=10.0",
  "PyMuPDF>=1.24",
  "PyYAML>=6.0",
]

[project.scripts]
kannon = "kannon.cli:main"

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]

[tool.ruff]
line-length = 100
target-version = "py310"
